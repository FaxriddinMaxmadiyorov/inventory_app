    add: Element qo'shish
    note: Format o'zgarganda mavjud elementlarning ID'lari o'zgarmaydi. Yangi format element yaratilganda yoki tahrirlanganda qo'llanadi.
    kinds:
      fixed: O'zgarmas matn
      rand20: 20 bitli tasodifiy son
      rand32: 32 bitli tasodifiy son
      rand6: 6 xonali tasodifiy son
      rand9: 9 xonali tasodifiy son
      guid: GUID
      datetime: Sana/vaqt
      sequence: Tartib raqami
    hints:
      fixed: O'zgarmaydigan matn bo'lagi. Istalgan Unicode belgilar, jumladan emoji.
      rand20: Tasodifiy qiymat. Masalan, olti xonali o'nlik (D6) yoki 5 xonali o'n oltilik (X5).
      rand32: Tasodifiy qiymat. Masalan, o'n xonali o'nlik (D10) yoki 8 xonali o'n oltilik (X8).
      rand6: 000000 dan 999999 gacha tasodifiy son (D6).
      rand9: 000000000 dan 999999999 gacha tasodifiy son (D9).
      guid: Global noyob identifikator, chiziqchalar bilan (D) yoki ularsiz (N).
      datetime: Element yaratilgan sana va vaqt. Masalan, yil (yyyy) yoki hafta kunining qisqartmasi (ddd).
      sequence: Tartib raqami. Masalan, oldida nollar bilan (D4) yoki ularsiz (D).
    help:
      fixed: "Matn o'zgarishsiz qo'yiladi.\nMisollar: PART-  |  📚-  |  _"
      rand20: "0 dan 1 048 575 gacha son.\nD — o'nlik, D7 — 7 xonagacha nollar bilan to'ldirilgan o'nlik.\nX — o'n oltilik, X5 — 5 xonagacha to'ldirilgan; kichik harflar uchun x5.\nKoddan keyingi matn o'zgarishsiz qo'shiladi: X5_ → A7E3A_"
      rand32: "0 dan 4 294 967 295 gacha son.\nD — o'nlik, D10 — nollar bilan to'ldirilgan o'nlik.\nX — o'n oltilik, X8 — 8 xonagacha to'ldirilgan; kichik harflar uchun x8.\nKoddan keyingi matn o'zgarishsiz qo'shiladi: X8- → E74FA329-"
      rand6: "0 dan 999 999 gacha son.\nD6 — doim olti xona, D — oldidagi nollarsiz.\nX yoki X5 — shu sonning o'n oltilik ko'rinishi.\nKoddan keyingi matn o'zgarishsiz qo'shiladi: D6_ → 004217_"
      rand9: "0 dan 999 999 999 gacha son.\nD9 — doim to'qqiz xona, D — oldidagi nollarsiz.\nX yoki X8 — shu sonning o'n oltilik ko'rinishi.\nKoddan keyingi matn o'zgarishsiz qo'shiladi."
      guid: "D — chiziqchalar bilan 36 belgi, N — ularsiz 32 belgi.\nKoddan keyingi matn o'zgarishsiz qo'shiladi: N- → 3f2a…9c-"
      datetime: "yyyy — yil, yy — yilning oxirgi ikki raqami\nMM — oy, MMM — oy nomining qisqartmasi\ndd — kun, ddd — hafta kunining qisqartmasi\nHH — soat, mm — daqiqa, ss — soniya\nBoshqa belgilar saqlanadi: yyyy-MM-dd_ → 2026-11-21_"
      sequence: "Inventardagi eng katta tartib raqami plyus bir.\nD — o'zgarishsiz, D4 — 4 xonagacha nollar bilan: 0013.\nX4 — o'n oltilik ko'rinishda.\nKoddan keyingi matn o'zgarishsiz qo'shiladi: D3_ → 013_"
