  custom_id:
    intro: Set up inventory numbers in your preferred format. Add elements, edit them, drag to reorder, or drag an element out of the list to delete it.
    example: Example
    element_type: Element type
    format: Format
    help_title: Formatting help
    add: Add element
    note: Existing items keep their IDs when the format changes. The new format is applied when an item is created or edited.
    kinds:
      fixed: Fixed text
      rand20: 20-bit random
      rand32: 32-bit random
      rand6: 6-digit random
      rand9: 9-digit random
      guid: GUID
      datetime: Date/time
      sequence: Sequence
    hints:
      fixed: A piece of unchanging text. Any Unicode characters, including emoji.
      rand20: A random value. E.g., a six-digit decimal (D6) or a 5-digit hex (X5).
      rand32: A random value. E.g., a ten-digit decimal (D10) or an 8-digit hex (X8).
      rand6: A random number from 000000 to 999999 (D6).
      rand9: A random number from 000000000 to 999999999 (D9).
      guid: A globally unique identifier, with dashes (D) or without (N).
      datetime: Item creation date and time. E.g., the year (yyyy) or an abbreviated day of the week (ddd).
      sequence: A sequential index. E.g., with leading zeros (D4) or without them (D).
    help:
      fixed: "The text is inserted as is.\nExamples: PART-  |  📚-  |  _"
      rand20: "A number from 0 to 1 048 575.\nD — decimal, D7 — decimal with leading zeros up to 7 digits.\nX — hex, X5 — hex padded to 5 digits; x5 for lower case.\nText after the code is appended as is: X5_ → A7E3A_"
      rand32: "A number from 0 to 4 294 967 295.\nD — decimal, D10 — decimal with leading zeros.\nX — hex, X8 — hex padded to 8 digits; x8 for lower case.\nText after the code is appended as is: X8- → E74FA329-"
      rand6: "A number from 0 to 999 999.\nD6 — always six digits, D — without leading zeros.\nX or X5 — the same number in hex.\nText after the code is appended as is: D6_ → 004217_"
      rand9: "A number from 0 to 999 999 999.\nD9 — always nine digits, D — without leading zeros.\nX or X8 — the same number in hex.\nText after the code is appended as is."
      guid: "D — 36 characters with dashes, N — 32 characters without them.\nText after the code is appended as is: N- → 3f2a…9c-"
      datetime: "yyyy — year, yy — two-digit year\nMM — month, MMM — abbreviated month name\ndd — day, ddd — abbreviated day of the week\nHH — hours, mm — minutes, ss — seconds\nOther characters are kept: yyyy-MM-dd_ → 2026-11-21_"
      sequence: "The largest sequence number in the inventory plus one.\nD — as is, D4 — with leading zeros up to 4 digits: 0013.\nX4 — the same in hex.\nText after the code is appended as is: D3_ → 013_"
